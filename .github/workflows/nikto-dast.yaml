name: Nikto DAST Scan
on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  nikto-scan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Run the Juice Shop Docker Container
      - name: Run OWASP Juice Shop Docker Container
        run: |
          # Run Juice Shop on port 3000
          docker run --rm -d -p 3000:3000 bkimminich/juice-shop

      # Step 2: Wait for the app to fully start
      - name: Wait for Juice Shop to start
        run: |
          # Wait for Juice Shop to be accessible before running Nikto
          sleep 15  # Adjust this if necessary based on the app startup time

      # Step 3: Ensure the directory exists and check permissions
      - name: Check directory permissions
        run: |
          # Ensure the directory exists and check permissions
          mkdir -p $GITHUB_WORKSPACE/nikto_reports  # Creates the directory
          ls -l $GITHUB_WORKSPACE/nikto_reports  # List directory contents and permissions

      # Step 4: Run Nikto Scan against the running Juice Shop web app
      - name: Run Nikto scan
        run: |
          # Run Nikto and save the report to the correct directory
          pwd 
          ls -l
          chmod -R 777 $GITHUB_WORKSPACE/nikto_reports
          docker run --rm -v $GITHUB_WORKSPACE/nikto_reports:/data ghcr.io/sullo/nikto \
            -h http://localhost:3000 \
            -output /data/nikto-report.json -Format json

      # Step 5: Upload Nikto JSON Report as Artifact
      - name: Upload Nikto JSON Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nikto-report
          path: $GITHUB_WORKSPACE/nikto_reports/nikto-report.json

      # Step 6: Upload Nikto results to DefectDojo
      - name: Upload Nikto results to DefectDojo
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Nikto Scan" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "file=@$GITHUB_WORKSPACE/nikto_reports/nikto-report.json"




