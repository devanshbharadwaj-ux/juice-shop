name: Terraform Security Scan with Checkov

on:
  push:
    branches: [ master ]
  
jobs:
  checkov-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Clone target Terraform repository
        run: |
          git clone https://github.com/octodemo/advanced-security-terraform.git
          cd advanced-security-terraform
          echo " Repository cloned successfully"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov and jq
        run: | 
          pip install checkov
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Run Checkov scan on cloned repo
        run: |
          cd advanced-security-terraform
          mkdir -p reports
          
          echo "🚀 Running Checkov scan..."
          checkov -d . --output json --output-file-path reports/checkov-report.json || EXIT_CODE=$?
          
          EXIT_CODE=${EXIT_CODE:-0}
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Checkov scan completed successfully."
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "⚠️ Checkov found policy violations (exit 2) — continuing workflow."
          else
            echo "⚠️ Checkov exited with code $EXIT_CODE — continuing anyway."
          fi

          # --- Improved jq handling for both object and array structures ---
          if [ -f reports/checkov-report.json ]; then
            echo "🔍 Validating Checkov JSON format..."
            if jq empty reports/checkov-report.json > /dev/null 2>&1; then
              echo "✅ JSON is valid, checking structure..."

              # Detect if root element is an array or object
              ROOT_TYPE=$(jq -r 'if type=="array" then "array" else "object" end' reports/checkov-report.json)

              if [ "$ROOT_TYPE" = "array" ]; then
                echo "📦 Root type: array — extracting first element."
                jq '.[0]' reports/checkov-report.json > reports/checkov-fixed.json
              else
                echo "📦 Root type: object — copying as is."
                cp reports/checkov-report.json reports/checkov-fixed.json
              fi

              echo "✅ JSON formatted successfully for DefectDojo."
            else
              echo "⚠️ Invalid JSON detected — keeping original."
              cp reports/checkov-report.json reports/checkov-fixed.json
            fi

            echo "📊 Showing Checkov summary for debug:"
            jq '.summary' reports/checkov-fixed.json || true
          else
            echo "{}" > reports/checkov-fixed.json
            echo "⚠️ No report generated, created empty file."
          fi

      - name: Upload Checkov reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkov-reports
          path: advanced-security-terraform/reports/

      - name: Send Checkov report to DefectDojo
        run: |
          echo " Uploading report to DefectDojo..."
          curl -X POST "${{ secrets.DEFECTDOJO_HOST }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Checkov Scan" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "file=@advanced-security-terraform/reports/checkov-fixed.json" \
            -F "active=true" \
            -F "verified=true" \
            -F "minimum_severity=Info" \
            -F "auto_create_context=true"
